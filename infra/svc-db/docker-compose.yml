# 서비스 MySQL (svc-db VM, 172.30.1.220)
# 지갑·원장 등 서비스 데이터. 스키마는 앱 쪽에서 관리하고, 여기서는 DB와 계정만 만든다.
services:
  mysql:
    image: mysql:8.4 # 8.4 LTS 라인. 패치 버전만 따라 올라간다
    container_name: svc-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file: .env # MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    volumes:
      - mysql-data:/var/lib/mysql
      - ./conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
